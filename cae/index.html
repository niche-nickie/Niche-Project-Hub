<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAE · NBAA-BACE 2026 — Niche</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../">← All projects</a>
    <div class="brand-tag">Niche Project Hub</div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-row">
        <h1 class="hero-title">CAE · NBAA-BACE 2026</h1>
        <span class="status-badge status-quoted">Quoted</span>
      </div>
      <p class="hero-sub">Las Vegas Convention Center · West Hall · Booth 3732</p>
    </section>

    <!-- Overview -->
    <section class="overview-grid" id="overview"></section>

    <!-- Timeline -->
    <section class="section-block">
      <h2 class="section-title">Project Timeline</h2>
      <div class="timeline" id="timeline"></div>
    </section>

    <!-- Renders -->
    <section class="section-block">
      <h2 class="section-title">Booth Visuals</h2>
      <div class="gallery" id="renders"></div>
    </section>

    <!-- Drawings -->
    <section class="section-block">
      <h2 class="section-title">Drawings</h2>
      <div class="gallery" id="drawings"></div>
    </section>

    <!-- Quote -->
    <section class="section-block">
      <h2 class="section-title">Quote</h2>
      <div class="quote" id="quote"></div>
    </section>

    <!-- Loose Items Checklist -->
    <section class="section-block">
      <div class="section-head-row">
        <h2 class="section-title">Checklist</h2>
        <div class="check-head-right">
          <span class="check-progress" id="check-progress">0 / 0</span>
          <button id="btn-edit-toggle" class="edit-toggle-btn" onclick="toggleEditMode()">✎ Edit Checklist</button>
        </div>
      </div>
      <div id="checklist"></div>
    </section>

    <!-- Notes -->
    <section class="section-block">
      <h2 class="section-title">Scope &amp; Notes</h2>
      <div class="notes" id="notes"></div>
    </section>

    <footer class="site-footer">
      <span>Niche Exhibit International Inc.</span>
      <span class="footer-dot">·</span>
      <span>Client: CAE</span>
    </footer>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()">
    <div id="lightbox-caption"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
